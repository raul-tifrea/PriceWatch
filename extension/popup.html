<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PriceWatch</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div id="app">
    <div id="view-login" class="view">
      <div class="popup-header">
        <div class="popup-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
          </svg>
          <span>PriceWatch</span>
        </div>
      </div>
      <div class="popup-body">
        <p class="popup-desc">Log in to start tracking prices across Romanian stores.</p>
        <div id="login-error" class="alert alert-error" style="display:none"></div>
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="••••••••" />
        </div>
        <button id="btn-login" class="btn-primary">Log In</button>
        <p class="switch-link">No account? <a href="#" id="go-register">Sign up</a></p>
      </div>
    </div>

    <div id="view-register" class="view" style="display:none">
      <div class="popup-header">
        <div class="popup-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
          </svg>
          <span>PriceWatch</span>
        </div>
      </div>
      <div class="popup-body">
        <p class="popup-desc">Create a free account to track prices.</p>
        <div id="register-error" class="alert alert-error" style="display:none"></div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <input id="reg-password" type="password" placeholder="At least 6 characters" />
        </div>
        <button id="btn-register" class="btn-primary">Create Account</button>
        <p class="switch-link">Already have one? <a href="#" id="go-login">Log in</a></p>
      </div>
    </div>

    <div id="view-loggedin" class="view" style="display:none">
      <div class="popup-header">
        <div class="popup-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
          </svg>
          <span>PriceWatch</span>
        </div>
        <button id="btn-logout" class="btn-logout" title="Log out">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </button>
      </div>
      <div class="popup-body">
        <div class="loggedin-info">
          <div class="user-avatar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </div>
          <div>
            <div class="loggedin-label">Logged in as</div>
            <div id="loggedin-email" class="loggedin-email"></div>
          </div>
        </div>
        <div class="status-box status-success">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
          </svg>
          Extension active. Visit a product page to track it.
        </div>
        <a href="http://localhost:5173" target="_blank" class="btn-dashboard">Open Dashboard ↗</a>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
